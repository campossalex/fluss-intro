[FLUSS]
bootstrap_servers = coordinator-server:9123
table_database    = app
table_name        = scan_events_log

[GENERATOR]
# inter-event delay range in milliseconds
min_freq_ms      = 50
max_freq_ms      = 200

# number of shipments in the simulated pool (concurrently in flight)
num_shipments    = 200

# max IN_TRANSIT hops before moving to OUT_FOR_DELIVERY
max_transit_hops = 3
